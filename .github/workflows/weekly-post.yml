name: Post semanal automático (NR1)

on:
  schedule:
    # Toda segunda-feira às 08:00 (horário de Brasília, UTC-3) => 11:00 UTC
    - cron: "0 11 * * 1"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write

jobs:
  gerar-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Buscar notícia e gerar post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_and_generate_post.py

      - name: Commit e push do novo post (se houver)
        run: |
          git config user.name "pulso-bot"
          git config user.email "pulso-bot@users.noreply.github.com"
          git add _posts data/posted_urls.json
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Post automático semanal sobre NR1 [skip ci]"
            git push
          fi
