# Configurações do site — Jekyll + tema minima
title: Meu Site Jekyll
description: >-
  Um site simples criado com Jekyll e o tema padrão minima,
  com uma seção de blog.
baseurl: "" # subpasta do site, ex: "/blog" — deixe vazio se for a raiz
url: "" # domínio final, ex: "https://seudominio.com"

# Tema
theme: minima

# Informações do autor (usadas pelo minima no rodapé/RSS)
author:
  name: Seu Nome
email: contato@exemplo.com

# Redes sociais (opcional — usadas pelo rodapé do minima)
minima:
  social_links:
    - platform: github
      user_url: "https://github.com/seuusuario"

# Plugins
plugins:
  - jekyll-feed

# Pastas/arquivos que o Jekyll não deve processar/copiar para o _site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
